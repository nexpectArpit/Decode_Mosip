map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $external_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    resolver 127.0.0.11 valid=10s;
    listen 80;
    listen 443 ssl;
    ssl_certificate /certificates/certify-nginx.crt;
    ssl_certificate_key /certificates/certify-nginx.key;
    # Default location for normal static files

    location / {
        root /config/server;
        autoindex on;
    }

    # Proxy API requests to mimoto-service
    location /v1/certify/ {
        set $certify_upstream certify;
        proxy_pass http://$certify_upstream:8090;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Certify's Compose metadata and offers contain its internal Docker
        # origin. Rewrite that origin for the caller so a phone following the
        # same response through the LAN/tunnel origin reaches this proxy.
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'http://certify-nginx:80/v1/certify/' '$external_scheme://$external_host/v1/certify/';
        sub_filter 'http://certify-nginx:80' '$external_scheme://$external_host/v1/certify';

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Handle OPTIONS requests (for pre-flight checks)
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /.well-known/did.json {
            set $playground_backend playground-backend;
            proxy_pass http://$playground_backend:4000/api/did/certify;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

            # Handle OPTIONS requests (for pre-flight checks)
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        location /.well-known/openid-credential-issuer {
                    set $certify_upstream certify;
                    proxy_pass http://$certify_upstream:8090/v1/certify/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
