# Phone-only protocol edge. The frontend, /api, and internal gateway routes are
# deliberately absent. Bind its host port to loopback and tunnel only this port.
map $http_x_forwarded_proto $phone_scheme {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Keep phone-side failures diagnosable without logging credential contents,
# query parameters (which can include request data), or authorization headers.
log_format phone_edge '$time_iso8601 $request_method $uri $status upstream=$upstream_status '
    'duration=$request_time upstream_duration=$upstream_response_time';

server {
    # Compose may recreate a gateway while this optional edge stays running.
    resolver 127.0.0.11 valid=5s;
    set $issuer_gateway certify-gateway;
    # Physical Inji Mobile 1.0.0-alpha.1 uses OpenID4VP 1.0/DCQL.
    set $verifier_gateway verify-gateway-alpha;
    set $playground_api playground-backend;
    listen 8080;
    server_name _;
    client_max_body_size 5m;
    access_log /dev/stdout phone_edge;
    error_log /dev/stderr info;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $phone_scheme;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /.well-known/did.json {
        limit_except GET { deny all; }
        proxy_pass http://$playground_api:4000/api/did/certify;
    }
    location = /.well-known/openid-credential-issuer {
        limit_except GET { deny all; }
        proxy_pass http://$issuer_gateway:8080/v1/certify/.well-known/openid-credential-issuer;
    }
    location = /.well-known/oauth-authorization-server {
        limit_except GET { deny all; }
        proxy_pass http://$issuer_gateway:8080/v1/certify/.well-known/oauth-authorization-server;
    }
    location = /v1/certify/.well-known/openid-credential-issuer {
        limit_except GET { deny all; }
        proxy_pass http://$issuer_gateway:8080;
    }
    location = /v1/certify/.well-known/oauth-authorization-server {
        limit_except GET { deny all; }
        proxy_pass http://$issuer_gateway:8080;
    }
    location = /v1/certify/.well-known/jwks.json {
        limit_except GET { deny all; }
        proxy_pass http://$issuer_gateway:8080;
    }
    location ~ ^/v1/certify/credential-offer-data/[A-Za-z0-9_-]+$ {
        limit_except GET { deny all; }
        proxy_pass http://$issuer_gateway:8080;
    }
    location = /v1/certify/oauth/token {
        limit_except POST { deny all; }
        proxy_pass http://$issuer_gateway:8080;
    }
    location = /v1/certify/issuance/credential {
        limit_except POST { deny all; }
        proxy_pass http://$issuer_gateway:8080;
    }

    location = /v1/verify/did.json {
        limit_except GET { deny all; }
        proxy_pass http://$verifier_gateway:8080;
    }
    location ~ ^/v1/verify/v2/vp-request/[A-Za-z0-9_-]+$ {
        limit_except GET { deny all; }
        proxy_pass http://$verifier_gateway:8080;
    }
    location ~ ^/v1/verify/vp-request/[A-Za-z0-9_-]+$ {
        limit_except GET { deny all; }
        proxy_pass http://$verifier_gateway:8080;
    }
    location = /v1/verify/v2/vp-submission/direct-post {
        limit_except POST { deny all; }
        proxy_pass http://$verifier_gateway:8080;
    }
    location = /v1/verify/vp-submission/direct-post {
        limit_except POST { deny all; }
        proxy_pass http://$verifier_gateway:8080;
    }

    location / { return 404; }
}
